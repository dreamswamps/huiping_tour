# ============================================================
#  红旅薪传 ——
#
#  用途：HTTP(80) 跳转 HTTPS(443)，443 反向代理到后端 3000
#  安装方法（证书到位后）：
#     1. 上传证书到 /etc/nginx/ssl/：
#          yaoqihuiping.com_bundle.pem
#          yaoqihuiping.com.key
#     2. cp nginx-hpt.conf /etc/nginx/sites-available/hpt
#     3. ln -sf /etc/nginx/sites-available/hpt /etc/nginx/sites-enabled/hpt
#     4. rm -f /etc/nginx/sites-enabled/default
#     5. nginx -t && systemctl reload nginx
# ============================================================

# 80 端口统一跳转到裸域名 HTTPS（证书为单域名，不含 www，故强制跳转裸域）
server {
    listen 80;
    server_name yaoqihuiping.com www.yaoqihuiping.com;
    return 301 https://yaoqihuiping.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yaoqihuiping.com www.yaoqihuiping.com;

    ssl_certificate     /etc/nginx/ssl/yaoqihuiping.com_bundle.pem;
    ssl_certificate_key /etc/nginx/ssl/yaoqihuiping.com.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 大文件/图片上传限制
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
